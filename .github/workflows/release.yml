# Managed by stuttter/.github fleet standards. Do not edit locally.
name: Release plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer version without a leading v.
        required: true
        type: string
      commit:
        description: Full commit SHA at the protected release branch head.
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    uses: stuttter/.github/.github/workflows/wordpress-plugin-release.yml@1333105a79a2bd5e56e452ad99d10a5dca9a7944
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      commit: ${{ inputs.commit }}
      release-branch: "master"
